{{ define "modules/navigate.html" }}
<link rel="stylesheet" href="/css/modules/navigate.css?v={{ version }}">
<link rel="stylesheet" href="/css/modules/theme.css?v={{ version }}">
<nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Меню навигации">
        <span class="hamburger"></span>
        <span class="hamburger"></span>
        <span class="hamburger"></span>
    </button>
    <div class="nav-links" id="nav-menu">
        <div class="nav-left">
            <a href="/">Главная</a>
            <a href="/about">О нас</a>
            <a href="/posts">Посты</a>
            {{ if and (ne .user.ID 0) (.user.IsPublisher) }}
            <a href="/i/upload">Загрузить</a>
            <a href="/i/posts">Мои посты</a>
            {{ end }}
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">🌙</button>
            {{ if eq .user.ID 0 }}
            <a class="login-button" href="/sso/auth">Вход</a>
            {{ else }}
            <a class="user-info" href="/i">Ваш email: {{ .user.Email }}</a>
            <a class="logout-button" href="/sso/logout">Выход</a>
            {{ end }}
        </div>
    </div>
</nav>
<script src="/js/navigate.js?v={{ version }}" defer></script>
{{ end }}
