{{ define "profile/posts.html" }}
{{ template "header.html" . }}
<style>
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 20px;
        }
        .image-box {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 300px;
            max-height: 500px;
            margin-bottom: 20px;
            border: none;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
        .search-form {
            margin: 20px;
            text-align: center;
        }
        .search-input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .autocomplete-suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            width: 400px;
        }
        .autocomplete-suggestion {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .autocomplete-suggestion:hover {
            background-color: #f0f0f0;
        }
        .tag-count {
            color: #666;
            font-size: 0.9em;
        }
    </style>
    <div class="search-form">
        <form method="GET" action="/i/posts" id="searchForm">
            <input type="text" name="tags" class="search-input" id="tagsInput" 
                   placeholder="Введите теги через пробел" value="{{.tags}}" autocomplete="off">
            <button type="submit" class="search-button">Найти</button>
            <input type="hidden" name="page" value="1">
        </form>
        <div id="autocomplete" class="autocomplete-suggestions" style="display:none;"></div>
    </div>
    <div class="container">
    {{ range .posts }}
        <div class="image-box">
            <a href="/i/view/{{.Path}}{{if $.tags}}?tags={{urlquery $.tags}}{{end}}">
                {{ if .IsEncrypted }}
                <div class="encrypted-placeholder" style="width: 100%; height: 200px; background-color: #f0f0f0; display: flex; align-items: center; justify-content: center; border-radius: 4px;">
                    <div style="text-align: center;">
                        <div style="font-size: 48px;">🔒</div>
                        <div style="font-size: 14px; color: #666; margin-top: 8px;">Зашифровано</div>
                    </div>
                </div>
                {{ else }}
                <img src="/image/{{ .Path }}" alt="{{ .Path }}">
                {{ end }}
            </a>
        </div>
    {{ end }}
    </div>
    {{ template "modules/pagination.html" . }}

<script>
(function() {
    const input = document.getElementById('tagsInput');
    const autocomplete = document.getElementById('autocomplete');
    let currentFocus = -1;

    input.addEventListener('input', function(e) {
        const prefix = e.target.value.trim();
        // Если ввод содержит пробелы, берем последнее слово для автодополнения
        const parts = prefix.split(' ');
        const lastPart = parts[parts.length - 1];
        if (lastPart.length < 1) {
            hideAutocomplete();
            return;
        }
        fetch('/api/tags?prefix=' + encodeURIComponent(lastPart))
            .then(response => response.json())
            .then(data => {
                showAutocomplete(data.tags, parts.slice(0, -1).join(' '), lastPart);
            })
            .catch(err => console.error('Ошибка автодополнения:', err));
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            currentFocus = (currentFocus + 1) % autocomplete.children.length;
            setActiveSuggestion();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            currentFocus = (currentFocus - 1 + autocomplete.children.length) % autocomplete.children.length;
            setActiveSuggestion();
        } else if (e.key === 'Enter' && currentFocus > -1) {
            e.preventDefault();
            autocomplete.children[currentFocus].click();
        } else if (e.key === 'Escape') {
            hideAutocomplete();
        }
    });

    document.addEventListener('click', function(e) {
        if (!autocomplete.contains(e.target) && e.target !== input) {
            hideAutocomplete();
        }
    });

    function showAutocomplete(tags, prefix, lastPart) {
        autocomplete.innerHTML = '';
        if (tags.length === 0) {
            hideAutocomplete();
            return;
        }
        tags.forEach(tag => {
            const div = document.createElement('div');
            div.className = 'autocomplete-suggestion';
            div.innerHTML = `<span>${tag.tag}</span><span class="tag-count">${tag.count} изображений</span>`;
            div.addEventListener('click', function() {
                // Заменяем последнюю часть на выбранный тег
                const newPrefix = prefix ? prefix + ' ' + tag.tag : tag.tag;
                input.value = newPrefix + ' ';
                input.focus();
                hideAutocomplete();
                // Можно сразу отправить форму, но лучше оставить пользователю нажать кнопку
            });
            autocomplete.appendChild(div);
        });
        autocomplete.style.display = 'block';
        currentFocus = -1;
    }

    function hideAutocomplete() {
        autocomplete.style.display = 'none';
        currentFocus = -1;
    }

    function setActiveSuggestion() {
        Array.from(autocomplete.children).forEach((child, idx) => {
            child.classList.toggle('active', idx === currentFocus);
        });
    }
})();
</script>

{{ template "footer.html" . }}
{{ end }}
